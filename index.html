<script>
const KEY='reprime_proto_v1',O={};let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}

const vol=e=>typeof VOL=='function'?VOL(e):e.reduce((t,x)=>t+x[1]*x[2]*x[3],0);
const rvol=s=>typeof RVOL=='function'?RVOL(s):s.ex.reduce((t,x,i)=>t+x[1]*x[2]*(+s.kg[i]||0),0);
function mk(T){const D=['Lunedì','Mercoledì','Venerdì'],r=[];
 for(let w=0;w<4;w++)D.forEach((d,i)=>r.push({w:w+1,d,n:T[i].n,ex:T[i].l.map(e=>[e[0],e[1],e[2],Math.round(e[3]*(1+.04*w)*2)/2]),kg:[],fb:[],rpe:'',bpm:'',ok:false}));
 r.slice(0,6).forEach((s,i)=>{s.ok=true;s.kg=s.ex.map(e=>e[3]-(i%3==1?2.5:0));s.fb=s.ex.map((e,j)=>['😐','💪','😐'][(i+j)%3]);s.rpe=7+(i%2)*.5;s.bpm=124+i*2});return r}

function spark(v,c){if(v.length<2)return'<p class="m">Servono almeno due misure per il grafico.</p>';const mn=Math.min(...v),r=(Math.max(...v)-mn)||1,n=v.length-1;
 const p=v.map((y,i)=>(10+i*280/n)+','+(52-(y-mn)/r*42)).join(' ');
 return'<svg viewBox="0 0 300 60" width="100%" height="64" role="img"><polyline points="'+p+'" fill="none" stroke="'+c+'" stroke-width="2.5" stroke-linejoin="round"/></svg>'}
function vPlan(){const p=A().plan;let h='<h2>Programmazione</h2><p class="m">Previsto contro eseguito. Tocca ✓ quando la sessione è fatta e inserisci RPE e bpm. “Apri scheda” mostra gli esercizi con carichi e feedback.</p>';
 for(let w=1;w<=4;w++){const ss=p.map((s,i)=>[s,i]).filter(x=>x[0].w==w),pv=ss.reduce((t,x)=>t+vol(x[0].ex),0),ev=ss.reduce((t,x)=>t+rvol(x[0]),0);
 h+='<h3>Settimana '+w+'</h3><div class="bar"><i style="width:'+Math.min(100,pv?ev/pv*100:0)+'%"></i></div><p class="m">Volume eseguito '+Math.round(ev)+' di '+Math.round(pv)+' kg previsti</p>';
 ss.forEach(([s,i])=>{const op=O[S.cur+'_'+i];
 h+='<div class="card"><div class="row"><b>'+s.d+' · '+s.n+'</b><button class="chk '+(s.ok?'on':'')+'" onclick="setS('+i+',\'ok\','+!s.ok+')" aria-label="Sessione fatta">✓</button></div>'+
 '<div class="g"><label>RPE reale<input type="number" min="1" max="10" step=".5" value="'+s.rpe+'" onchange="setS('+i+',\'rpe\',this.value)"></label><label>bpm medi<input type="number" value="'+s.bpm+'" onchange="setS('+i+',\'bpm\',this.value)"></label></div>'+
 '<button class="lnk" onclick="tog('+i+')">'+(op?'Chiudi scheda':'Apri scheda')+'</button>';
 if(op)h+=s.ex.map((e,j)=>'<div class="ex"><span>'+e[0]+' '+e[1]+'×'+e[2]+' @'+e[3]+' kg</span><input type="number" placeholder="kg reali" value="'+(s.kg[j]||'')+'" onchange="setKg('+i+','+j+',this.value)"><span>'+['😣','😐','💪'].map(f=>'<button class="fb '+(s.fb[j]==f?'on':'')+'" onclick="setFb('+i+','+j+',\''+f+'\')">'+f+'</button>').join('')+'</span></div>').join('');
 h+='</div>'})}return h}
function tagWH(v,l,k){return v<l?'<span class="tag ok">nella norma</span>':v<l+(k||.1)?'<span class="tag wa">da monitorare</span>':'<span class="tag bad">elevato</span>'}
function vBody(){const a=A(),b=[...a.body].sort((x,y)=>x.d>y.d?1:-1),l=b[b.length-1],f=b[0];
 const whr=l.waist/l.hips,wht=l.waist/l.h,bmi=l.w/Math.pow(l.h/100,2),dh=l.hr-f.hr;
 let h='<h2>Misure e composizione</h2><p class="m">Ogni inserimento aggiorna indici e grafici.</p><div class="g">'+
 '<div class="kpi"><span class="m">Peso</span><b>'+l.w+' kg</b><span class="tag m">'+(l.w-f.w>=0?'+':'')+(l.w-f.w).toFixed(1)+' dal primo dato</span></div>'+
 '<div class="kpi"><span class="m">FC a riposo</span><b>'+l.hr+' bpm</b><span class="tag '+(dh<=0?'ok':'wa')+'">'+(dh>0?'+':'')+dh+' dal primo dato</span></div>'+
 '<div class="kpi"><span class="m">WHR vita/fianchi</span><b>'+whr.toFixed(2)+'</b>'+tagWH(whr,a.sex=='M'?.9:.85,.1)+'</div>'+
 '<div class="kpi"><span class="m">WHtR vita/altezza</span><b>'+wht.toFixed(2)+'</b>'+tagWH(wht,.5,.1)+'</div>'+
 '<div class="kpi"><span class="m">BMI</span><b>'+bmi.toFixed(1)+'</b><span class="tag m">indicativo, non distingue massa magra</span></div>'+
 '<div class="kpi"><span class="m">% grasso</span><b>'+l.bf+'%</b><span class="tag m">'+(l.w*l.bf/100).toFixed(1)+' kg di massa grassa</span></div></div>'+
 '<h3>Andamento</h3><div class="card"><span class="m">Peso</span>'+spark(b.map(x=>x.w),'var(--c)')+'<span class="m">FC a riposo</span>'+spark(b.map(x=>x.hr),'var(--g)')+'</div>'+
 '<h3>Nuova misurazione</h3><div class="card"><div class="g"><label>Data<input id="m_d" type="date" value="'+new Date().toISOString().slice(0,10)+'"></label><label>Peso kg<input id="m_w" type="number" step=".1" value="'+l.w+'"></label><label>Altezza cm<input id="m_h" type="number" value="'+l.h+'"></label><label>Vita cm<input id="m_v" type="number" step=".5" value="'+l.waist+'"></label><label>Fianchi cm<input id="m_f" type="number" step=".5" value="'+l.hips+'"></label><label>FC riposo<input id="m_r" type="number" value="'+l.hr+'"></label><label>% grasso<input id="m_b" type="number" step=".1" value="'+l.bf+'"></label></div><button class="btn" onclick="addBody()">Salva misurazione</button></div>'+
 '<h3>Storico</h3><div class="scroll"><table><tr><th>Data</th><th>kg</th><th>Vita</th><th>FC</th><th>%G</th></tr>'+b.slice().reverse().map(x=>'<tr><td>'+x.d.slice(5)+'</td><td>'+x.w+'</td><td>'+x.waist+'</td><td>'+x.hr+'</td><td>'+x.bf+'</td></tr>').join('')+'</table></div>';return h}
function addBody(){const g=id=>+document.getElementById(id).value,d=document.getElementById('m_d').value;
 if(!d||!g('m_w')||!g('m_h')||!g('m_v')||!g('m_f')){alert('Compila data, peso, altezza, vita e fianchi.');return}
 A().body.push({d,w:g('m_w'),h:g('m_h'),waist:g('m_v'),hips:g('m_f'),hr:g('m_r'),bf:g('m_b')});save();R()}

function vNut(){const a=A(),n=a.n,l=[...a.body].sort((x,y)=>x.d>y.d?1:-1).pop();
 const bmr=10*l.w+6.25*l.h-5*a.age+(a.sex=='M'?5:-161),tdee=bmr*n.act,kc=Math.round(tdee*(1+n.goal/100)),pr=Math.round(n.pro*l.w),ft=Math.round(kc*n.fat/100/9),ch=Math.max(0,Math.round((kc-pr*4-ft*9)/4));
 const z=n.goal<0?['Deficit','var(--o)']:n.goal>0?['Surplus','var(--c)']:['Mantenimento','var(--g)'];
 return'<h2>Consigli alimentari</h2><p class="m">Indicazioni generali, non un piano dietetico. Stima di partenza per '+a.sex+', '+a.age+' anni, '+l.w+' kg (formula Mifflin-St Jeor). Da validare e personalizzare dal professionista.</p>'+
 '<div class="card"><div class="row"><span class="m">Zona</span><b style="color:'+z[1]+'">'+z[0]+' '+(n.goal>0?'+':'')+n.goal+'%</b></div><b style="font:700 40px \'Barlow Condensed\',\'Arial Narrow\',sans-serif">'+kc+' kcal</b><span class="m"> mantenimento stimato '+Math.round(tdee)+' kcal</span>'+
 '<div class="bk"><i style="width:'+pr*4/kc*100+'%;background:var(--c)"></i><i style="width:'+ft*9/kc*100+'%;background:var(--o)"></i><i style="flex:1;background:var(--g)"></i></div>'+
 '<div class="g" style="grid-template-columns:1fr 1fr 1fr"><div class="kpi"><span class="m">Proteine</span><b>'+pr+' g</b></div><div class="kpi"><span class="m">Grassi</span><b>'+ft+' g</b></div><div class="kpi"><span class="m">Carboidrati</span><b>'+ch+' g</b></div></div></div>'+

 '<label>Attività<select onchange="setN(\'act\',this.value)">'+[[1.4,'Bassa'],[1.55,'Moderata'],[1.7,'Alta'],[1.9,'Molto alta']].map(o=>'<option value="'+o[0]+'"'+(o[0]==n.act?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></label>'+
 '<label>Proteine g/kg<input type="number" step=".1" min=".8" max="3" value="'+n.pro+'" onchange="setN(\'pro\',this.value)"></label><label>Grassi % kcal<input type="number" min="15" max="45" value="'+n.fat+'" onchange="setN(\'fat\',this.value)"></label></div></div>'}
function R(){const s=document.getElementById('sel');s.innerHTML=S.a.map((a,i)=>'<option value="'+i+'"'+(i==S.cur?' selected':'')+'>'+a.name+'</option>').join('');
 [0,1,2].forEach(i=>document.getElementById('t'+i).className=S.tab==i?'on':'');
 document.getElementById('app').innerHTML=[vPlan,vBody,vNut][S.tab]()}
R();
